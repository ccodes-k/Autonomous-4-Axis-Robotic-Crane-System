[gcode_macro YAW_LEFT]
description: Rotate disk CCW
gcode:
    _CHECK_SAFETY
    {% set angle = params.ANGLE|default(10)|float %}
    {% set speed = params.SPEED|default(40)|float %}
    {% set accel = params.ACCEL|default(100)|float %}
