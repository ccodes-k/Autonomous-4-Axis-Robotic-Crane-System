[gcode_macro UP]
description: Move Z up
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(5)|float %}
    {% set speed = params.SPEED|default(20)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
