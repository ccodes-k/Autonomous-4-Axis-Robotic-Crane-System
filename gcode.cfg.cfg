# =========================================================
# ENABLE / DISABLE MACROS
# =========================================================

[gcode_macro ENABLE_X]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=1
    MANUAL_STEPPER STEPPER=x1 ENABLE=1

[gcode_macro DISABLE_X]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=0
    MANUAL_STEPPER STEPPER=x1 ENABLE=0

[gcode_macro ENABLE_Y]
gcode:
    MANUAL_STEPPER STEPPER=y ENABLE=1
    MANUAL_STEPPER STEPPER=y1 ENABLE=1

[gcode_macro DISABLE_Y]
gcode:
    MANUAL_STEPPER STEPPER=y ENABLE=0
    MANUAL_STEPPER STEPPER=y1 ENABLE=0

[gcode_macro ENABLE_Z]
gcode:
    MANUAL_STEPPER STEPPER=z ENABLE=1
    MANUAL_STEPPER STEPPER=z1 ENABLE=1

[gcode_macro DISABLE_Z]
gcode:
    MANUAL_STEPPER STEPPER=z ENABLE=0
    MANUAL_STEPPER STEPPER=z1 ENABLE=0

[gcode_macro ENABLE_EOF]
gcode:
    MANUAL_STEPPER STEPPER=eof ENABLE=1

[gcode_macro DISABLE_EOF]
gcode:
    MANUAL_STEPPER STEPPER=eof ENABLE=0

[gcode_macro ENABLE_DISK]
gcode:
