    MANUAL_STEPPER STEPPER=disk1 ENABLE=1

[gcode_macro DISABLE_DISK]
gcode:
    MANUAL_STEPPER STEPPER=disk ENABLE=0
    MANUAL_STEPPER STEPPER=disk1 ENABLE=0

[gcode_macro ENABLE_ALL]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=1
    MANUAL_STEPPER STEPPER=x1 ENABLE=1
    MANUAL_STEPPER STEPPER=y ENABLE=1
    MANUAL_STEPPER STEPPER=y1 ENABLE=1
    MANUAL_STEPPER STEPPER=z ENABLE=1
    MANUAL_STEPPER STEPPER=z1 ENABLE=1
    MANUAL_STEPPER STEPPER=eof ENABLE=1
    MANUAL_STEPPER STEPPER=disk ENABLE=1
    MANUAL_STEPPER STEPPER=disk1 ENABLE=1

[gcode_macro DISABLE_ALL]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=0
    MANUAL_STEPPER STEPPER=x1 ENABLE=0
    MANUAL_STEPPER STEPPER=y ENABLE=0
    MANUAL_STEPPER STEPPER=y1 ENABLE=0
    MANUAL_STEPPER STEPPER=z ENABLE=0
    MANUAL_STEPPER STEPPER=z1 ENABLE=0
    MANUAL_STEPPER STEPPER=eof ENABLE=0
    MANUAL_STEPPER STEPPER=disk ENABLE=0
    MANUAL_STEPPER STEPPER=disk1 ENABLE=0
    
[gcode_macro ROBOT_SEQ_1]
gcode:
    # Init and zero all steppers
    INIT_ALL
    ZERO_ALL

    G4 S3

    # 1. raise Z axis by 30
    Z_UP DIST=30
    G4 S3

    # 2. rotate CCW
    DISK_CCW
    G4 S3

    # 3. move X backward by 50
    X_BACKWARD DIST=80
    G4 S3

    # 4. move X forward by 50
    X_FORWARD DIST=80
    G4 S3

    # 5. rotate CW
    DISK_CW
    G4 S3

    # 6. move Y forward by 50
    Y_FORWARD DIST=50
    G4 S3

    # 7. decrease Z height by 20
    Z_DOWN DIST=70
    G4 S3

    # 8. raise Z by 20
    Z_UP DIST=40
    G4 S3

    # 9. move Y backward by 50
    Y_BACKWARD DIST=50
    G4 S10

    # 10. rotate CCW
    DISK_CCW
    G4 S3

    # 11. move X backward by 60
    X_BACKWARD DIST=80
    G4 S3

    # 12. lower Z by 30
    Z_DOWN DIST=30
# =========================================================
# RESET ALL STEPPER POSITIONS TO 0
# =========================================================

[gcode_macro ZERO_ALL]
gcode:
    MANUAL_STEPPER STEPPER=x SET_POSITION=0
    MANUAL_STEPPER STEPPER=x1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=y SET_POSITION=0
    MANUAL_STEPPER STEPPER=y1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=z SET_POSITION=0
    MANUAL_STEPPER STEPPER=z1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=eof SET_POSITION=0
    MANUAL_STEPPER STEPPER=disk SET_POSITION=0
    MANUAL_STEPPER STEPPER=disk1 SET_POSITION=0

    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE=0
    SET_GCODE_VARIABLE MACRO=Y_STATE VARIABLE=pos VALUE=0
    SET_GCODE_VARIABLE MACRO=Z_STATE VARIABLE=pos VALUE=0
    SET_GCODE_VARIABLE MACRO=EOF_STATE VARIABLE=pos VALUE=0
    SET_GCODE_VARIABLE MACRO=DISK_STATE VARIABLE=pos VALUE=0

    RESPOND TYPE=command MSG="All steppers zeroed"
# =========================================================
# BOX SELECTION STATE - readable by Orin Nano via Moonraker
# =========================================================

[gcode_macro BOX_STATE]
variable_box_id: 0
variable_box_code: 'NONE'
variable_box_label: 'No Box Selected'
gcode:

[gcode_macro BOX_SMALL]
description: Select small box
gcode:
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_id VALUE=1
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_code VALUE="'BOX_SMALL'"
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_label VALUE="'Box Small'"
    M117 Box Small
    RESPOND TYPE=command MSG="BOX_SELECTED id=1 code=BOX_SMALL label=Box Small"

[gcode_macro BOX_MEDIUM]
description: Select medium box
gcode:
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_id VALUE=2
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_code VALUE="'BOX_MEDIUM'"
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_label VALUE="'Box Medium'"
    M117 Box Medium
    RESPOND TYPE=command MSG="BOX_SELECTED id=2 code=BOX_MEDIUM label=Box Medium"

[gcode_macro BOX_LARGE]
description: Select large box
gcode:
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_id VALUE=3
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_code VALUE="'BOX_LARGE'"
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_label VALUE="'Box Large'"
    M117 Box Large
    RESPOND TYPE=command MSG="BOX_SELECTED id=3 code=BOX_LARGE label=Box Large"

[gcode_macro CLEAR_BOX_SELECTION]
description: Clear selected box
gcode:
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_id VALUE=0
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_code VALUE="'NONE'"
    SET_GCODE_VARIABLE MACRO=BOX_STATE VARIABLE=box_label VALUE="'No Box Selected'"
    M117 Box Cleared
    RESPOND TYPE=command MSG="BOX_SELECTED id=0 code=NONE label=No Box Selected"

[gcode_macro GET_BOX_SELECTION]
description: Print current box selection
gcode:
    RESPOND TYPE=command MSG="BOX_SELECTED id={printer['gcode_macro BOX_STATE'].box_id} code={printer['gcode_macro BOX_STATE'].box_code} label={printer['gcode_macro BOX_STATE'].box_label}"
[gcode_macro SAFETY_STATE]
variable_paused: 0
gcode:

[gcode_macro SAFETY_PAUSE]
description: Pause machine from ROS safety node
gcode:
    {% if printer["gcode_macro SAFETY_STATE"].paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=SAFETY_STATE VARIABLE=paused VALUE=1
        RESPOND TYPE=command MSG="SAFETY_PAUSE triggered"
        PAUSE
    {% else %}
        RESPOND TYPE=command MSG="SAFETY_PAUSE ignored: already latched"
    {% endif %}

[gcode_macro SAFETY_RESUME]
description: Resume after safety pause
gcode:
    SET_GCODE_VARIABLE MACRO=SAFETY_STATE VARIABLE=paused VALUE=0
    ENABLE_ALL
    {% if printer.pause_resume.is_paused %}
        RESPOND TYPE=command MSG="Safety resume requested"
        RESUME
    {% else %}
        RESPOND TYPE=command MSG="Resume ignored: printer is not paused"
    {% endif %}

[gcode_macro SAFETY_CLEAR]
description: Clear safety latch without resuming motion
gcode:
    SET_GCODE_VARIABLE MACRO=SAFETY_STATE VARIABLE=paused VALUE=0
    RESPOND TYPE=command MSG="Safety latch cleared"
[gcode_macro _CHECK_SAFETY]
gcode:
    {% if printer["gcode_macro SAFETY_STATE"].paused|int == 1 %}
        { action_raise_error("Safety latch active - movement blocked") }
    {% endif %}
# =========================================================
# SCREEN-FRIENDLY WRAPPER MACROS
# =========================================================

[gcode_macro HOME_ALL_CUSTOM]
description: Init all, zero all, and home X
gcode:
    INIT_ALL
    ZERO_ALL
    HOME_X
    RESPOND TYPE=command MSG="HOME_ALL_CUSTOM complete: X homed, other axes zeroed"

[gcode_macro LEFT]
description: Move gantry left
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(10)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    X_BACKWARD DIST={dist} SPEED={speed} ACCEL={accel}

[gcode_macro RIGHT]
description: Move gantry right
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(10)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    X_FORWARD DIST={dist} SPEED={speed} ACCEL={accel}

[gcode_macro FORWARD]
description: Move forward
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(10)|float %}
    {% set speed = params.SPEED|default(10)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    Y_FORWARD DIST={dist} SPEED={speed} ACCEL={accel}

[gcode_macro BACKWARD]
description: Move backward
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(10)|float %}
    {% set speed = params.SPEED|default(10)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
