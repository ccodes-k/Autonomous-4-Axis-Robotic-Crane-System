# =========================================================
# BTT OCTOPUS PRO v1.0.1 / STM32F446 / TMC2209
# PORT6 = X
# EBB42 = X SECOND MOTOR (MOVE TOGETHER)
# PORT0 + PORT1 = Y (DUAL STEPPERS, MOVE TOGETHER)
# PORT2 + PORT3 = Z (DUAL STEPPERS, MOVE TOGETHER)
# PORT7 = EOF
# PORT5 + PORT4 = DISK ROTATION (DUAL STEPPERS, MOVE TOGETHER)
# ALL USING MANUAL_STEPPER
# X USING SENSORLESS / VIRTUAL ENDSTOP
# =========================================================

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_450045001551303432323631-if00
restart_method: command

[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_EBB42_GEN-if00
restart_method: command

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

# =========================================================
# MOTOR6 / PORT6 = X AXIS MAIN
# EN   = PD4
# STEP = PE2
# DIR  = PE3
# UART = PE1
# DIAG = PG14
# =========================================================

[tmc2209 manual_stepper x]
uart_pin: PE1
diag_pin: ^PG14
run_current: 1.5
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0
driver_SGTHRS: 110

[manual_stepper x]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 100
position_min: -999
position_max: 999
endstop_pin: tmc2209_x:virtual_endstop

# =========================================================
# EBB42 = X AXIS SECOND MOTOR
# STEP = EBB:PD3
# DIR  = EBB:PD2
# EN   = !EBB:PB6
# UART = EBB:PB3
# NOTE:
# - This motor mirrors X main in macros
# - If the two X motors fight each other, invert one DIR pin
#   by changing EBB:PD2 -> !EBB:PD2
# =========================================================

[tmc2209 manual_stepper x1]
uart_pin: EBB:PB3
run_current: 1.9
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper x1]
step_pin: EBB:PD3
dir_pin: EBB:PD2
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 100
position_min: -999
position_max: 999

# =========================================================
# MOTOR0 / PORT0 = Y AXIS MAIN
# EN   = PF14
# STEP = PF13
# DIR  = PF12
# UART = PC4
# =========================================================

[tmc2209 manual_stepper y]
uart_pin: PC4
run_current: 1.80
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper y]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 100
position_min: -99999
position_max: 99999

# =========================================================
# MOTOR1 / PORT1 = Y AXIS SECOND MOTOR
# EN   = PF15
# STEP = PG0
# DIR  = PG1
# UART = PD11
# NOTE:
# - This motor mirrors Y main in macros
# - If the two Y motors fight each other, invert one DIR pin
#   by changing PG1 -> !PG1
# =========================================================

[tmc2209 manual_stepper y1]
uart_pin: PD11
run_current: 1.80
hold_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper y1]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
velocity: 50
accel: 100
position_min: -99999
position_max: 99999

# =========================================================
# MOTOR2 / PORT2 = Z AXIS MAIN
# EN   = PG5
# STEP = PF11
# DIR  = PG3
# UART = PC6
# =========================================================

[tmc2209 manual_stepper z]
uart_pin: PC6
run_current: 1.5
hold_current:1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 50
position_min: -100
position_max: 400

# =========================================================
# MOTOR3 / PORT3 = Z AXIS SECOND MOTOR
# EN   = PA0
# STEP = PG4
# DIR  = PC1
# UART = PC7
# NOTE:
# - This motor mirrors Z main in macros
# - If the two Z motors fight each other, invert one DIR pin
#   by changing PC1 -> !PC1
# =========================================================

[tmc2209 manual_stepper z1]
uart_pin: PC7
run_current: 1.5
hold_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 50
position_min: -100
position_max: 400

# =========================================================
# MOTOR7 / PORT7 = EOF
# EN   = PE0
# STEP = PE6
# DIR  = PA14
# UART = PD3
# =========================================================

[tmc2209 manual_stepper eof]
uart_pin: PD3
run_current: 1.5
hold_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper eof]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
velocity: 10
accel: 30
position_min: -999
position_max: 999

# =========================================================
# MOTOR5 / PORT5 = DISK ROTATION MAIN
# EN   = PF1
# STEP = PC13
# DIR  = PF0
# UART = PE4
# rotation_distance=360 means:
# MOVE=90 = 90 degrees
# =========================================================

[tmc2209 manual_stepper disk]
uart_pin: PE4
run_current: 1.8
hold_current: 0.60
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper disk]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 360
velocity: 90
accel: 180
position_min: -190
position_max: 190

# =========================================================
# MOTOR4 / PORT4 = DISK ROTATION SECOND MOTOR
# EN   = PG2
# STEP = PF9
# DIR  = PF10
# UART = PF2
# NOTE:
# - This motor mirrors disk main in macros
# - If the two disk motors fight each other, invert one DIR pin
#   by changing PF10 -> !PF10
# =========================================================

[tmc2209 manual_stepper disk1]
uart_pin: PF2
run_current: 1.8
hold_current: 0.60
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper disk1]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 360
velocity: 90
accel: 180
position_min: -190
position_max: 190

# =========================================================
# FAN
# =========================================================

[output_pin fan5]
pin: PD15
pwm: False
value: 1
shutdown_value: 0

# =========================================================
# POSITION STATE HOLDERS
# =========================================================

[gcode_macro X_STATE]
variable_pos: 0.0
gcode:

[gcode_macro Y_STATE]
variable_pos: 0.0
gcode:

[gcode_macro Z_STATE]
variable_pos: 0.0
gcode:

[gcode_macro EOF_STATE]
variable_pos: 0.0
gcode:

[gcode_macro DISK_STATE]
variable_pos: 0.0
gcode:

# =========================================================
# INIT MACROS
# =========================================================

[gcode_macro INIT_X]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=1
    MANUAL_STEPPER STEPPER=x1 ENABLE=1
    MANUAL_STEPPER STEPPER=x SET_POSITION=0
    MANUAL_STEPPER STEPPER=x1 SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE=0

[gcode_macro INIT_Y]
gcode:
    MANUAL_STEPPER STEPPER=y ENABLE=1
    MANUAL_STEPPER STEPPER=y1 ENABLE=1
    MANUAL_STEPPER STEPPER=y SET_POSITION=0
    MANUAL_STEPPER STEPPER=y1 SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=Y_STATE VARIABLE=pos VALUE=0

[gcode_macro INIT_Z]
gcode:
    MANUAL_STEPPER STEPPER=z ENABLE=1
    MANUAL_STEPPER STEPPER=z1 ENABLE=1
    MANUAL_STEPPER STEPPER=z SET_POSITION=0
    MANUAL_STEPPER STEPPER=z1 SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=Z_STATE VARIABLE=pos VALUE=0

[gcode_macro INIT_EOF]
gcode:
    MANUAL_STEPPER STEPPER=eof ENABLE=1
    MANUAL_STEPPER STEPPER=eof SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=EOF_STATE VARIABLE=pos VALUE=0

[gcode_macro INIT_DISK]
gcode:
    MANUAL_STEPPER STEPPER=disk ENABLE=1
    MANUAL_STEPPER STEPPER=disk1 ENABLE=1
    MANUAL_STEPPER STEPPER=disk SET_POSITION=0
    MANUAL_STEPPER STEPPER=disk1 SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=DISK_STATE VARIABLE=pos VALUE=0

[gcode_macro INIT_ALL]
gcode:
    INIT_X
    INIT_Y
    INIT_Z
    INIT_EOF
    INIT_DISK

# =========================================================
# HOMING MACROS - X
# =========================================================

[gcode_macro HOME_X]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=1
    MANUAL_STEPPER STEPPER=x SET_POSITION=20
    MANUAL_STEPPER STEPPER=x MOVE=0 SPEED=3 ACCEL=20 STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=x SET_POSITION=0
    MANUAL_STEPPER STEPPER=x1 SET_POSITION=0
    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE=0

[gcode_macro HOME_X_SAFE]
gcode:
    MANUAL_STEPPER STEPPER=x ENABLE=1
    MANUAL_STEPPER STEPPER=x SET_POSITION=20
    MANUAL_STEPPER STEPPER=x MOVE=0 SPEED=2 ACCEL=10 STOP_ON_ENDSTOP=2

# =========================================================
# X AXIS MOVE MACROS
# BOTH X MOTORS MOVE TOGETHER
# =========================================================

[gcode_macro X_FORWARD]
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(50)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    {% set cur = printer["gcode_macro X_STATE"].pos|float %}
    {% set newpos = cur + dist %}
    MANUAL_STEPPER STEPPER=x MOVE={newpos} SPEED={speed} ACCEL={accel} SYNC=0
    MANUAL_STEPPER STEPPER=x1 MOVE={newpos} SPEED={speed} ACCEL={accel}
    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE={newpos}

[gcode_macro X_BACKWARD]
gcode:
    _CHECK_SAFETY
    {% set dist = params.DIST|default(50)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    {% set cur = printer["gcode_macro X_STATE"].pos|float %}
    {% set newpos = cur - dist %}
    MANUAL_STEPPER STEPPER=x MOVE={newpos} SPEED={speed} ACCEL={accel} SYNC=0
    MANUAL_STEPPER STEPPER=x1 MOVE={newpos} SPEED={speed} ACCEL={accel}
    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE={newpos}

[gcode_macro X_MOVE_ABS]
gcode:
    _CHECK_SAFETY
    {% set pos = params.POS|default(0)|float %}
    {% set speed = params.SPEED|default(30)|float %}
    {% set accel = params.ACCEL|default(80)|float %}
    MANUAL_STEPPER STEPPER=x MOVE={pos} SPEED={speed} ACCEL={accel} SYNC=0
    MANUAL_STEPPER STEPPER=x1 MOVE={pos} SPEED={speed} ACCEL={accel}
    SET_GCODE_VARIABLE MACRO=X_STATE VARIABLE=pos VALUE={pos}

